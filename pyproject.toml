[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowbane-lab"
version = "0.1.0"
description = "Deterministic simulation and bot-policy tooling for Shadowbane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shadowbane-lab = "shadowbane_lab.cli:main"
shadowbane-runtime-consistency = "shadowbane_lab.runtime_consistency.__main__:main"
shadowbane-terrain-audit = "shadowbane_lab.world_data.terrain_seam_cli:main"
wonderbane-texture-export = "shadowbane_lab.client_extension.texture_export:main"

[project.optional-dependencies]
simulation = [
    "numpy>=2.0",
    "numba>=0.60",
]
learning = [
    "torch>=2.5",
]
client = [
    "PyAutoGUI>=0.9.54",
    "Pillow>=11.0",
]
client-extension = [
    "capstone>=5.0.6,<6",
]
test = [
    "capstone>=5.0.6,<6",
    "jsonschema>=4.23",
    "Pillow>=11.0",
    "PyAutoGUI>=0.9.54",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shadowbane_lab.rulesets" = ["data/*.json"]
"shadowbane_lab.differential" = ["data/*.json"]
"shadowbane_lab.client_observation" = ["data/*.json"]
"shadowbane_lab.manager" = ["static/*.html"]
"shadowbane_lab.progression" = ["data/*.json"]
"shadowbane_lab.equipment" = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The texture-engine consolidation predates this branch by one commit. Limit the temporary
# exception to its two existing line-wrap findings while the asset facade remains fully linted.
"src/shadowbane_lab/client_extension/texture_cache.py" = ["E501"]
"tests/test_texture_cache_engine.py" = ["E501"]
# The exporter deliberately catches broad cache-format ValueError subclasses as anonymous
# nontexture skip records. Keep that compatibility tuple explicit and local to this module.
"src/shadowbane_lab/client_extension/texture_export.py" = ["B014", "E501"]
"tests/test_texture_export.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
