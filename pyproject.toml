[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowbane-lab"
version = "0.1.0"
description = "Deterministic simulation and bot-policy tooling for Shadowbane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
simulation = [
    "numpy>=2.0",
    "numba>=0.60",
]
learning = [
    "torch>=2.5",
]
client = [
    "PyAutoGUI>=0.9.54",
]
test = [
    "jsonschema>=4.23",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shadowbane_lab.rulesets" = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
