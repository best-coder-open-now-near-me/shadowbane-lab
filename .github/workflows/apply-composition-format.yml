name: Apply composition formatting

on:
  push:
    branches:
      - feat/build-simulation-case-views
    paths:
      - ".github/workflows/apply-composition-format.yml"

permissions:
  contents: write

jobs:
  format-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Repair and format composition files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/shadowbane_lab/composition/model.py")
          text = path.read_text(encoding="utf-8")
          old = '''            raise CompositionError("participant slots do not match scenario slots (" + "; ".join(details) + ")")
          '''
          new = '''            detail = "; ".join(details)
              raise CompositionError(
                  f"participant slots do not match scenario slots ({detail})"
              )
          '''
          if text.count(old) != 1:
              raise RuntimeError("participant-slot validation line was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          ruff check --fix src/shadowbane_lab/composition tests/test_composition_views.py tests/test_composition_io.py
          ruff format src/shadowbane_lab/composition tests/test_composition_views.py tests/test_composition_io.py
      - name: Validate repository
        run: |
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-composition-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add compositional build and simulation case views"
          git push
