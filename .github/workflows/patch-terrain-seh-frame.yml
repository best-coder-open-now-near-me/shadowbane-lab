name: Patch terrain repair SEH frame

on:
  push:
    branches:
      - codex/terrain-material-repair-final-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/terrain-material-repair-final-v2
          fetch-depth: 0
      - name: Move object construction outside the SEH function
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/terrain_delivery_finalize_v2.py')
          source = path.read_text(encoding='utf-8')
          anchor = '    runtime_path.write_text(runtime_source, encoding="utf-8", newline="\\n")\n'
          if source.count(anchor) != 1:
              raise SystemExit('terrain runtime write anchor is not unique')

          patch = r'''    runtime_source = _replace_once(
              runtime_source,
              "ClientRepairResult RepairBuiltTerrainGuarded(\n"
              "    void* terrain,\n"
              "    const Token& key) noexcept {\n"
              "    ClientRepairResult result = ClientRepairResult::failed;\n"
              "    __try {\n"
              "        result = RepairBuiltTerrain(terrain, key);\n"
              "    } __except (EXCEPTION_EXECUTE_HANDLER) {\n"
              "        AbortTerrainBuild();\n"
              "    }\n"
              "    return result;\n"
              "}\n",
              "ClientRepairResult RepairBuiltTerrainUnchecked(\n"
              "    void* terrain,\n"
              "    const std::uint32_t resource,\n"
              "    const std::uint32_t group) noexcept {\n"
              "    return RepairBuiltTerrain(terrain, Token{resource, group});\n"
              "}\n\n"
              "bool TryRepairBuiltTerrain(\n"
              "    void* terrain,\n"
              "    const std::uint32_t resource,\n"
              "    const std::uint32_t group,\n"
              "    ClientRepairResult* result) noexcept {\n"
              "    if (result == nullptr) {\n"
              "        return false;\n"
              "    }\n"
              "    __try {\n"
              "        *result = RepairBuiltTerrainUnchecked(terrain, resource, group);\n"
              "        return true;\n"
              "    } __except (EXCEPTION_EXECUTE_HANDLER) {\n"
              "        return false;\n"
              "    }\n"
              "}\n",
              "object-free terrain SEH wrapper",
          )
          runtime_source = _replace_once(
              runtime_source,
              "    } else {\n"
              "        repair_result = RepairBuiltTerrainGuarded(*output_terrain, key);\n"
              "    }\n",
              "    } else if (!TryRepairBuiltTerrain(\n"
              "                   *output_terrain,\n"
              "                   terrain_resource,\n"
              "                   terrain_group,\n"
              "                   &repair_result)) {\n"
              "        AbortTerrainBuild();\n"
              "        repair_result = ClientRepairResult::failed;\n"
              "    }\n",
              "terrain SEH call site",
          )
          '''
          source = source.replace(anchor, patch + anchor)
          path.write_text(source, encoding='utf-8', newline='\n')
          PY
          python -m py_compile tools/terrain_delivery_finalize_v2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/terrain_delivery_finalize_v2.py
          git diff --cached --check
          git commit -m 'ci: isolate terrain repair SEH frame'
          git push origin HEAD:codex/terrain-material-repair-final-v2
