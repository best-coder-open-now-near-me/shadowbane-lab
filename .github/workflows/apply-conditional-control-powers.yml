name: Apply conditional control-power migration

on:
  push:
    branches:
      - feat/conditional-control-powers
    paths:
      - ".github/workflows/apply-conditional-control-powers.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source and test migration
        run: |
          python .github/scripts/apply_conditional_control_powers.py
          python .github/scripts/adjust_conditional_control_tests.py
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Format and validate
        run: |
          ruff check --fix src tests
          ruff format src tests
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Remove temporary applicators and commit
        run: |
          rm .github/scripts/apply_conditional_control_powers.py
          rm .github/scripts/adjust_conditional_control_tests.py
          rm .github/workflows/apply-conditional-control-powers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: condition control follow-ups on stun application"
          git push
