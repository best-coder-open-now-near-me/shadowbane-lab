name: Apply WonderBane.com target profile v2

on:
  push:
    branches:
      - codex/game-behavior-corpus
    paths:
      - ".github/workflows/apply-wonderbane-target-profile-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply corrected target-profile script
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(".github/workflows/apply-wonderbane-target-profile.yml")
          source = workflow.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          script = dedent(source[start:end])
          old = 'row for row in corpus["coverage"] if "build" in row["domain"].lower()'
          new = (
              'row for row in corpus["coverage"] '
              'if row["domain"].startswith("Build-derived attributes")'
          )
          if script.count(old) != 1:
              raise SystemExit("expected exactly one broad build-coverage selector")
          script = script.replace(old, new)
          exec(compile(script, str(workflow), "exec"), {"__name__": "__main__"})
          PY
      - name: Validate corpus and repository
        run: |
          python -m pip install -e ".[test]"
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Commit target-profile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/shadowbane-behavior-corpus-v1.json \
                  research/sources/wonderbane-com-home-2026-08-29.md \
                  docs/game-behavior-corpus.md
          git commit -m "research: identify WonderBane.com as target runtime"
          git push
