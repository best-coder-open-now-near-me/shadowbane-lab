name: Gate weapon modifiers behind trigger chance

on:
  push:
    branches:
      - codex/open-build-exploration
    paths:
      - ".github/workflows/fix-weapon-modifier-chance.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply chance-gating correction
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one block in {path}")
              target.write_text(source.replace(old, new), encoding="utf-8")

          replace_once(
              "src/shadowbane_lab/sim/actions.py",
              '''        if self.attack_modifier is not None and not isinstance(
              self.attack_modifier, AttackModifierSpec
          ):
              raise ValueError("attack_modifier must be an AttackModifierSpec or null")
''',
              '''        if self.attack_modifier is not None and not isinstance(
              self.attack_modifier, AttackModifierSpec
          ):
              raise ValueError("attack_modifier must be an AttackModifierSpec or null")
          if (
              self.attack_modifier is not None
              and self.fire_on is not TriggerMoment.ATTEMPT
          ):
              raise ValueError("attack modifiers must fire at the attempt moment")
''',
          )

          replace_once(
              "src/shadowbane_lab/sim/effects.py",
              '''        contexts = self._matching_trigger_contexts(actor, item.action_key, action_tags)
          modifiers = tuple(
              context.trigger.attack_modifier
              for context in contexts
              if context.trigger.attack_modifier is not None
          )
          self._resolve_trigger_moment(
              contexts,
              TriggerMoment.ATTEMPT,
              actor,
              item,
              due_time,
              eligible_alive,
              events,
          )
''',
              '''        contexts = self._matching_trigger_contexts(actor, item.action_key, action_tags)
          fired_attempt_contexts = self._resolve_trigger_moment(
              contexts,
              TriggerMoment.ATTEMPT,
              actor,
              item,
              due_time,
              eligible_alive,
              events,
          )
          modifiers = tuple(
              context.trigger.attack_modifier
              for context in fired_attempt_contexts
              if context.trigger.attack_modifier is not None
          )
''',
          )

          replace_once(
              "src/shadowbane_lab/sim/effects.py",
              '''    def _resolve_trigger_moment(
          self,
          contexts: tuple[_TriggerContext, ...],
          moment: TriggerMoment,
          actor: EntityState,
          item: ScheduledItem,
          due_time: int,
          eligible_alive: frozenset[str],
          events: list[Event],
      ) -> None:
          for context in contexts:
''',
              '''    def _resolve_trigger_moment(
          self,
          contexts: tuple[_TriggerContext, ...],
          moment: TriggerMoment,
          actor: EntityState,
          item: ScheduledItem,
          due_time: int,
          eligible_alive: frozenset[str],
          events: list[Event],
      ) -> tuple[_TriggerContext, ...]:
          fired_contexts: list[_TriggerContext] = []
          for context in contexts:
''',
          )

          replace_once(
              "src/shadowbane_lab/sim/effects.py",
              '''                if fired:
                      events.append(
''',
              '''                if fired:
                      fired_contexts.append(context)
                      events.append(
''',
          )

          replace_once(
              "src/shadowbane_lab/sim/effects.py",
              '''                    events.append(
                          self._effect_removed_event(
                              actor,
                              context.active,
                              due_time,
                              item,
                              "reason.trigger_consumed",
                          )
                      )

      def _chance_roll(self, chance: float) -> tuple[float, bool]:
''',
              '''                    events.append(
                          self._effect_removed_event(
                              actor,
                              context.active,
                              due_time,
                              item,
                              "reason.trigger_consumed",
                          )
                      )
          return tuple(fired_contexts)

      def _chance_roll(self, chance: float) -> tuple[float, bool]:
''',
          )

          test_path = Path("tests/test_weapon_resolution.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''    def test_persistent_hit_proc_survives_multiple_attacks(self) -> None:
'''
          addition = '''    def test_attack_modifier_applies_only_when_its_trigger_fires(self) -> None:
          swing = weapon_action()
          proc_action = ActionSpec(
              action_key="modifier_provider",
              targeting=TargetingSpec(kind=TargetKind.SELF),
              phases=(
                  ActionPhase(
                      kind=PhaseKind.ACTIVE,
                      duration_ms=0,
                      effects=(ApplyEffect(SubjectRef.ACTOR, "chance_modifier", 10_000),),
                  ),
              ),
              armed_trigger=ActionTriggerSpec(
                  trigger_key="chance_modifier",
                  required_action_tags=("attack", "weapon"),
                  fire_on=TriggerMoment.ATTEMPT,
                  consume_on=TriggerConsumption.NEVER,
                  chance=0.0,
                  attack_modifier=AttackModifierSpec(
                      bonus_damage_minimum=20.0,
                      bonus_damage_maximum=20.0,
                  ),
              ),
          )
          modifier = ActiveEffectState(
              effect_key="chance_modifier",
              source_entity_id="a",
              magnitude=1.0,
              expires_at_ms=10_000,
          )
          environment = ReferenceEnvironment(
              ActionCatalog((proc_action, swing)),
              (
                  actor("a", "red", ("swing",), effects={"chance_modifier": modifier}),
                  actor("b", "blue", ()),
              ),
              seed=61,
          )

          batch = environment.step(
              (decision(environment, "a", "swing", target_id="b", correlation_id="chance"),)
          )

          self.assertEqual(490.0, environment.entity("b").scalars["health"])
          checked = next(event for event in batch.events if event.kind == EventKind.TRIGGER_CHECKED)
          self.assertIn("result.not_fired", checked.tags)

      def test_attack_modifier_requires_attempt_moment(self) -> None:
          with self.assertRaisesRegex(ValueError, "attempt moment"):
              ActionTriggerSpec(
                  trigger_key="late_modifier",
                  required_action_tags=("attack", "weapon"),
                  fire_on=TriggerMoment.HIT,
                  attack_modifier=AttackModifierSpec(damage_multiplier=2.0),
              )

'''
          if tests.count(marker) != 1:
              raise SystemExit("weapon test insertion marker was not found exactly once")
          test_path.write_text(tests.replace(marker, addition + marker), encoding="utf-8")
          PY
      - name: Validate
        run: |
          python -m pip install -e ".[test]"
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: gate weapon modifiers behind trigger chance"
          git push
