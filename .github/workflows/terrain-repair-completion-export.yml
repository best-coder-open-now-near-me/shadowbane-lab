name: Terrain repair completion source export

on:
  push:
    branches:
      - codex/terrain-material-repair-completion

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=zip --output=shadowbane-terrain-repair-completion.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: shadowbane-terrain-repair-completion
          path: shadowbane-terrain-repair-completion.zip
          if-no-files-found: error
          retention-days: 1
