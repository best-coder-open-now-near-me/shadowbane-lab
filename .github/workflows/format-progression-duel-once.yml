name: Format progression duel once

on:
  push:
    branches:
      - codex/progression-duel-sim

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.16.4
      - name: Apply formatter
        run: ruff format src tests
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Apply Ruff formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
