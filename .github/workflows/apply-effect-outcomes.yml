name: Apply simulator effect outcomes

on:
  push:
    branches:
      - feat/simulator-effect-outcomes
    paths:
      - ".github/workflows/apply-effect-outcomes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply outcome integration
        run: |
          rm -f .github/effect-outcomes-test-diagnostics.txt
          python .github/scripts/apply_effect_outcomes.py
          python - <<'PY'
          from pathlib import Path


          def indent_between(path: str, start: str, end: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              block = text[start_index:end_index]
              if block.startswith("    "):
                  raise RuntimeError(f"{path}: generated block was already indented")
              block = "".join(
                  f"    {line}" if line.strip() else line
                  for line in block.splitlines(keepends=True)
              )
              target.write_text(
                  text[:start_index] + block + text[end_index:],
                  encoding="utf-8",
              )


          effects_path = "src/shadowbane_lab/sim/effects.py"
          indent_between(
              effects_path,
              "def _resolve_direct(\n",
              "    def expire_effect(\n",
          )
          indent_between(
              effects_path,
              "def _apply_effect(\n",
              "    def _remove_effect(\n",
          )
          path = Path(effects_path)
          text = path.read_text(encoding="utf-8")
          old = (
              "moved = before.distance_to(after) "
              "if before is not None and after is not None else 0.0"
          )
          new = (
              "moved = (hypot(after.x - before.x, after.y - before.y) "
              "if before is not None and after is not None else 0.0)"
          )
          if text.count(old) != 1:
              raise RuntimeError("generated movement outcome measurement was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Format generated implementation
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
      - name: Run tests and capture focused failures
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/effect-outcomes-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/effect-outcomes-tests.log').read_text(encoding='utf-8')
          blocks = text.split('=' * 70 + '\n')
          failures = [
              block.rstrip()
              for block in blocks
              if block.startswith(('FAIL:', 'ERROR:'))
          ]
          tail = '\n'.join(text.splitlines()[-12:])
          report = '# Effect-outcome validation failures\n\n'
          report += ('\n\n' + '=' * 70 + '\n\n').join(failures)
          report += '\n\n# Summary\n\n' + tail + '\n'
          Path('.github/effect-outcomes-test-diagnostics.txt').write_text(
              report,
              encoding='utf-8',
          )
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/effect-outcomes-test-diagnostics.txt
            git commit -m "chore: capture effect outcome test failures"
            git push
            exit "$status"
          fi
      - name: Validate lint and formatting
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Remove temporary machinery and commit effect outcomes
        run: |
          rm -f .github/effect-outcomes-test-diagnostics.txt
          rm .github/scripts/apply_effect_outcomes.py .github/workflows/apply-effect-outcomes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add typed effect outcomes and conditionals"
          git push
