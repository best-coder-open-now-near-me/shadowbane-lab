name: Apply simulator effect outcomes

on:
  push:
    branches:
      - feat/simulator-effect-outcomes
    paths:
      - ".github/workflows/apply-effect-outcomes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Align applicator with current action imports
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_effect_outcomes.py")
          text = path.read_text(encoding="utf-8")
          old = '''    "from shadowbane_lab.protocol import Relation, TargetKind, Vector2\\n",
              "from shadowbane_lab.protocol import Relation, TargetKind, Vector2\\n"
              "from shadowbane_lab.sim.outcomes import EffectOutcomeKind\\n",
          '''
          new = '''    "from shadowbane_lab.protocol import NamedScalar, Relation, TargetKind\\n",
              "from shadowbane_lab.protocol import NamedScalar, Relation, TargetKind\\n"
              "from shadowbane_lab.sim.outcomes import EffectOutcomeKind\\n",
          '''
          if text.count(old) != 1:
              raise RuntimeError("effect outcome import patch was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Apply outcome integration
        run: python .github/scripts/apply_effect_outcomes.py
      - name: Remove temporary applicator
        run: rm .github/scripts/apply_effect_outcomes.py .github/workflows/apply-effect-outcomes.yml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Format and validate
        run: |
          ruff check --fix src tests
          ruff format src tests
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Commit effect outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add typed effect outcomes and conditionals"
          git push
