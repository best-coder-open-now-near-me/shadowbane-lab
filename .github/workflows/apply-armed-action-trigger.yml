name: Apply generic armed-action trigger

on:
  push:
    branches:
      - codex/open-build-exploration
    paths:
      - ".github/workflows/apply-armed-action-trigger.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply trigger primitive
        run: python .github/armed-trigger-payload/apply.py
      - name: Validate and format
        run: |
          python -m pip install -e ".[test]"
          ruff check --fix src tests
          ruff format src tests
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Commit trigger primitive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: trigger weapon powers on the next qualifying action"
          git push
