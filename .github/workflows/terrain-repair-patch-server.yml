name: Terrain repair public patch manifest

on:
  push:
    branches:
      - codex/terrain-material-repair-workspace
    paths:
      - .github/workflows/terrain-repair-patch-server.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public WonderBane patch manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-patch-manifest
          curl --fail --location --retry 4 --retry-delay 2 \
            --user-agent 'WonderBanePatcher/1.0' \
            --output public-patch-manifest/manifest.json \
            'http://87.99.132.84/manifest.json'
          python -m json.tool public-patch-manifest/manifest.json \
            > public-patch-manifest/manifest.pretty.json
          sha256sum public-patch-manifest/manifest.json \
            > public-patch-manifest/manifest.sha256
      - name: Upload public manifest
        uses: actions/upload-artifact@v4
        with:
          name: wonderbane-public-patch-manifest
          path: public-patch-manifest
          if-no-files-found: error
          retention-days: 1
