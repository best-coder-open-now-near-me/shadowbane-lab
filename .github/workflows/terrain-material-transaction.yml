name: Terrain material transaction

on:
  push:
    branches:
      - codex/terrain-material-repair
  pull_request:
    paths:
      - native/wonderbane_extension/terrain_material_*.h
      - native/wonderbane_extension/terrain_material_*.cpp
      - .github/workflows/terrain-material-transaction.yml

permissions:
  contents: read

jobs:
  transaction-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile transaction tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            native/wonderbane_extension/terrain_material_plan.cpp \
            native/wonderbane_extension/terrain_material_transaction.cpp \
            native/wonderbane_extension/terrain_material_transaction_test.cpp \
            -o terrain_material_transaction_test
      - name: Run transaction tests
        run: ./terrain_material_transaction_test

  transaction-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile transaction tests
        shell: cmd
        run: >-
          cl /nologo /std:c++20 /EHsc /W4 /WX
          native\wonderbane_extension\terrain_material_plan.cpp
          native\wonderbane_extension\terrain_material_transaction.cpp
          native\wonderbane_extension\terrain_material_transaction_test.cpp
          /Feterrain_material_transaction_test.exe
      - name: Run transaction tests
        shell: cmd
        run: terrain_material_transaction_test.exe
