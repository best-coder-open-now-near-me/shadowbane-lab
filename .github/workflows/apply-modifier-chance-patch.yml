name: Apply modifier chance-gating patch

on:
  push:
    branches:
      - codex/open-build-exploration
    paths:
      - ".github/patches/gate-weapon-modifier-chance.patch"
      - ".github/workflows/apply-modifier-chance-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        run: |
          git apply --recount --check .github/patches/gate-weapon-modifier-chance.patch
          git apply --recount .github/patches/gate-weapon-modifier-chance.patch
          rm .github/patches/gate-weapon-modifier-chance.patch
      - name: Validate
        run: |
          python -m pip install -e ".[test]"
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: gate weapon modifiers behind trigger chance"
          git push
