name: Weapon-pipeline body-recipe ablation

on:
  push:
    branches:
      - codex/open-build-exploration
    paths:
      - ".github/workflows/weapon-pipeline-experiment.yml"

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Run mixed, fixed-body, and body-only variants
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from collections import defaultdict
          from dataclasses import replace
          from itertools import combinations
          from pathlib import Path

          from shadowbane_lab.rollouts.open_builds import (
              generate_primitive_loadouts,
              resolve_primitive_loadout,
              run_open_duel,
          )
          from shadowbane_lab.rollouts.ruleset import load_assassin_warlock_duel_ruleset
          from shadowbane_lab.rollouts.duel import TerminationReason

          ruleset = load_assassin_warlock_duel_ruleset()
          original = generate_primitive_loadouts(
              ruleset,
              count=16,
              seed=19,
              minimum_actions=2,
              maximum_actions=6,
          )
          fixed_scalars = (
              ("attack_rating", 150.0),
              ("defense", 150.0),
              ("weapon.main_hand.damage_min", 12.0),
              ("weapon.main_hand.damage_max", 28.0),
              ("resistance.physical", 0.25),
              ("passive.block.chance", 0.10),
              ("passive.dodge.chance", 0.08),
          )
          fixed_body = tuple(
              replace(
                  item,
                  health=550.0,
                  mana=340.0,
                  stamina=240.0,
                  move_speed=17.0,
                  scalars=fixed_scalars,
              )
              for item in original
          )
          body_only = tuple(
              replace(
                  item,
                  action_keys=(),
                  persistent_trigger_keys=(),
                  display_name=item.display_name + " — body only",
              )
              for item in original
          )

          def run_variant(name, loadouts):
              score = defaultdict(lambda: {"wins": 0, "losses": 0, "draws": 0, "matches": 0})
              runs = []
              time_limits = 0
              for first, second in combinations(loadouts, 2):
                  for seed in (1, 2, 3):
                      for left, right in ((first, second), (second, first)):
                          result = run_open_duel(
                              ruleset,
                              left,
                              right,
                              starting_distance=60.0,
                              max_ticks=600,
                              seed=seed,
                          ).duel
                          time_limits += result.reason is TerminationReason.TIME_LIMIT
                          for item in (left, right):
                              row = score[item.loadout_id]
                              row["matches"] += 1
                              row["draws"] += result.winner_entity_id is None
                              row["wins"] += result.winner_entity_id == item.loadout_id
                              row["losses"] += (
                                  result.winner_entity_id is not None
                                  and result.winner_entity_id != item.loadout_id
                              )
                          runs.append(
                              {
                                  "left": left.loadout_id,
                                  "right": right.loadout_id,
                                  "seed": seed,
                                  "winner": result.winner_entity_id,
                                  "reason": result.reason.value,
                                  "ticks": result.ticks,
                                  "trace_digest": result.trace_digest,
                              }
                          )
              ranking = sorted(
                  score,
                  key=lambda key: (
                      score[key]["wins"] / max(1, score[key]["matches"]),
                      score[key]["wins"],
                      key,
                  ),
                  reverse=True,
              )
              return {
                  "name": name,
                  "scores": dict(score),
                  "ranking": ranking,
                  "runs": runs,
                  "time_limits": time_limits,
                  "unique_traces": len({item["trace_digest"] for item in runs}),
              }

          variants = {
              "mixed": run_variant("mixed bodies and recipes", original),
              "fixed_body": run_variant("fixed body, varied recipes", fixed_body),
              "body_only": run_variant("varied bodies, common attacks only", body_only),
          }
          resolved = {
              item.loadout_id: resolve_primitive_loadout(item, ruleset).as_dict()
              for item in original
          }

          def spearman(first, second):
              first_rank = {key: index for index, key in enumerate(first)}
              second_rank = {key: index for index, key in enumerate(second)}
              count = len(first)
              squared = sum(
                  (first_rank[key] - second_rank[key]) ** 2
                  for key in first_rank
              )
              return 1.0 - 6.0 * squared / (count * (count * count - 1))

          comparisons = {
              "mixed_vs_fixed_body_rank_correlation": spearman(
                  variants["mixed"]["ranking"],
                  variants["fixed_body"]["ranking"],
              ),
              "mixed_vs_body_only_rank_correlation": spearman(
                  variants["mixed"]["ranking"],
                  variants["body_only"]["ranking"],
              ),
          }
          payload = {
              "ruleset_id": ruleset.ruleset_id,
              "loadouts": resolved,
              "variants": variants,
              "comparisons": comparisons,
          }
          Path("artifacts/body-recipe-ablation.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Body / recipe ablation",
              "",
              "Sixteen identical generated signatures were evaluated at 60 units,",
              "three seeds, and both left/right orientations.",
              "",
              "| Variant | Playouts | Time limits | Unique traces | Top loadout | Top win rate |",
              "|:---|---:|---:|---:|:---|---:|",
          ]
          for key in ("mixed", "fixed_body", "body_only"):
              variant = variants[key]
              top = variant["ranking"][0]
              row = variant["scores"][top]
              lines.append(
                  f"| {variant['name']} | {len(variant['runs'])} | "
                  f"{variant['time_limits']} | {variant['unique_traces']} | `{top}` | "
                  f"{row['wins'] / row['matches']:.1%} |"
              )
          lines.extend(
              [
                  "",
                  (
                      "- Mixed versus fixed-body rank correlation: "
                      f"{comparisons['mixed_vs_fixed_body_rank_correlation']:.3f}"
                  ),
                  (
                      "- Mixed versus body-only rank correlation: "
                      f"{comparisons['mixed_vs_body_only_rank_correlation']:.3f}"
                  ),
                  "",
              ]
          )
          for key in ("mixed", "fixed_body", "body_only"):
              variant = variants[key]
              lines.extend([f"## {variant['name']}", ""])
              for index, loadout_id in enumerate(variant["ranking"][:8], start=1):
                  row = variant["scores"][loadout_id]
                  actions = ", ".join(
                      action.rsplit(".", 1)[-1]
                      for action in resolved[loadout_id]["executable_action_keys"]
                  ) or "common move/basic attack only"
                  lines.append(
                      f"{index}. `{loadout_id}` — {row['wins'] / row['matches']:.1%} "
                      f"({row['wins']}-{row['losses']}-{row['draws']}): {actions}"
                  )
              lines.append("")
          summary = "\n".join(lines) + "\n"
          Path("artifacts/body-recipe-ablation.md").write_text(summary, encoding="utf-8")
          print(summary)
          PY
          cat artifacts/body-recipe-ablation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ablation
        uses: actions/upload-artifact@v4
        with:
          name: weapon-pipeline-body-recipe-ablation
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
