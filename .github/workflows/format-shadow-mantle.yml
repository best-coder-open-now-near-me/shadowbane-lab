name: Format Shadow Mantle loader

on:
  push:
    branches:
      - codex/shadow-mantle-sim
    paths:
      - ".github/workflows/format-shadow-mantle.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format loader
        run: |
          python -m pip install "ruff>=0.12"
          ruff format src/shadowbane_lab/rulesets/loader.py
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadowbane_lab/rulesets/loader.py
          git commit -m "style: format ranked restoration loader"
          git push
