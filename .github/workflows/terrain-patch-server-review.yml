name: Terrain patch server review

on:
  push:
    branches:
      - codex/terrain-material-export-da109b0

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official patch manifest
        run: |
          mkdir -p terrain-patch-server-review
          curl --fail --location --retry 3 --retry-delay 2 \
            http://87.99.132.84/manifest.json \
            --output terrain-patch-server-review/manifest.json
          python -m json.tool terrain-patch-server-review/manifest.json \
            > terrain-patch-server-review/manifest.pretty.json
      - name: Resolve and retain executable candidates
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          out = Path('terrain-patch-server-review')
          manifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8-sig'))
          candidates = []

          def walk(value, trail=()):
              if isinstance(value, dict):
                  for key, item in value.items():
                      walk(item, trail + (str(key),))
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      walk(item, trail + (str(index),))
              elif isinstance(value, str):
                  lower = value.lower().replace('\\', '/')
                  if lower.endswith('.exe') and ('sb' in lower or 'shadowbane' in lower):
                      candidates.append({'trail': list(trail), 'value': value})

          walk(manifest)
          unique = []
          seen = set()
          for candidate in candidates:
              value = candidate['value']
              if value.lower() in seen:
                  continue
              seen.add(value.lower())
              unique.append(candidate)

          base = 'http://87.99.132.84/'
          results = []
          for index, candidate in enumerate(unique):
              value = candidate['value'].replace('\\', '/')
              url = value if value.startswith(('http://', 'https://')) else urllib.parse.urljoin(base, urllib.parse.quote(value))
              record = {**candidate, 'url': url}
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      data = response.read(64 * 1024 * 1024 + 1)
                  if len(data) > 64 * 1024 * 1024:
                      raise ValueError('candidate exceeds 64 MiB review cap')
                  digest = hashlib.sha256(data).hexdigest()
                  record.update({'state': 'downloaded', 'size': len(data), 'sha256': digest})
                  if digest == '55fbad5f0110cd99b4085af72d1e8fddb782ccdec1491478492c18158f5c61bc':
                      (out / 'reviewed-sb.exe').write_bytes(data)
                  else:
                      (out / f'candidate-{index}.exe').write_bytes(data)
              except Exception as error:
                  record.update({'state': 'failed', 'error': f'{type(error).__name__}: {error}'})
              results.append(record)
          (out / 'executable-candidates.json').write_text(
              json.dumps(results, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload bounded patch-server evidence
        uses: actions/upload-artifact@v4
        with:
          name: terrain-patch-server-review
          path: terrain-patch-server-review/
          if-no-files-found: error
          retention-days: 1
