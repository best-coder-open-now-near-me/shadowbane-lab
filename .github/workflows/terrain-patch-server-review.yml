name: Terrain patch server review

on:
  push:
    branches:
      - codex/terrain-material-export-da109b0

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official patch manifest
        run: |
          mkdir -p terrain-patch-server-review
          curl --fail --location --retry 3 --retry-delay 2 \
            http://87.99.132.84/manifest.json \
            --output terrain-patch-server-review/manifest.json
          python -m json.tool terrain-patch-server-review/manifest.json \
            > terrain-patch-server-review/manifest.pretty.json
      - name: Resolve and retain executable candidates
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          out = Path('terrain-patch-server-review')
          manifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8-sig'))
          files = manifest.get('files')
          if not isinstance(files, list):
              raise SystemExit('manifest files is not a list')
          server_root = 'http://87.99.132.84/'
          base_url = manifest.get('baseUrl', '')
          if not isinstance(base_url, str):
              raise SystemExit('manifest baseUrl is not a string')
          download_base = urllib.parse.urljoin(server_root, base_url.rstrip('/') + '/')
          results = []
          seen = set()
          for index, item in enumerate(files):
              if not isinstance(item, dict):
                  continue
              value = item.get('path')
              if not isinstance(value, str):
                  continue
              lower = value.lower().replace('\\', '/')
              if not lower.endswith('.exe') or ('sb' not in lower and 'shadowbane' not in lower):
                  continue
              if lower in seen:
                  continue
              seen.add(lower)
              url = urllib.parse.urljoin(download_base, urllib.parse.quote(value.replace('\\', '/')))
              record = {'manifest_index': index, 'value': value, 'url': url}
              try:
                  with urllib.request.urlopen(url, timeout=120) as response:
                      data = response.read(64 * 1024 * 1024 + 1)
                  if len(data) > 64 * 1024 * 1024:
                      raise ValueError('candidate exceeds 64 MiB review cap')
                  digest = hashlib.sha256(data).hexdigest()
                  record.update({'state': 'downloaded', 'size': len(data), 'sha256': digest})
                  expected_size = item.get('size')
                  expected_digest = item.get('sha256')
                  record['manifest_size_matches'] = expected_size == len(data)
                  record['manifest_sha256_matches'] = expected_digest == digest
                  if not record['manifest_size_matches'] or not record['manifest_sha256_matches']:
                      raise ValueError('download identity disagrees with manifest')
                  if digest == '55fbad5f0110cd99b4085af72d1e8fddb782ccdec1491478492c18158f5c61bc':
                      (out / 'reviewed-sb.exe').write_bytes(data)
                  else:
                      (out / f'candidate-{index}.exe').write_bytes(data)
              except Exception as error:
                  record.update({'state': 'failed', 'error': f'{type(error).__name__}: {error}'})
              results.append(record)
          (out / 'executable-candidates.json').write_text(
              json.dumps(results, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload bounded patch-server evidence
        uses: actions/upload-artifact@v4
        with:
          name: terrain-patch-server-review
          path: terrain-patch-server-review/
          if-no-files-found: error
          retention-days: 1
