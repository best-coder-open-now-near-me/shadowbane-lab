name: Apply CI portability fixes

on:
  push:
    branches:
      - codex/fix-simulator-foundation-ci
    paths:
      - ".github/ci-portability-fix.py"
      - ".github/workflows/apply-ci-portability-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch stale platform-bound test fixtures
        run: python .github/ci-portability-fix.py
      - name: Validate repaired modules and format
        run: |
          python -m pip install -e ".[test]"
          ruff format tests/test_cli.py tests/test_manager_cli.py
          python -m unittest discover -s tests -p "test_cli.py" -v
          python -m unittest discover -s tests -p "test_manager_cli.py" -v
          ruff check tests/test_cli.py tests/test_manager_cli.py
          ruff format --check tests/test_cli.py tests/test_manager_cli.py
      - name: Commit tested fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_cli.py tests/test_manager_cli.py
          git commit -m "test: restore cross-platform CI fixtures"
          git push
