name: Patch terrain delivery test dependencies

on:
  push:
    branches:
      - codex/terrain-material-repair-final-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/terrain-material-repair-final-v2
          fetch-depth: 0
      - name: Apply exact dependency correction and remove this workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/terrain-repair-deliver-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = 'python -m pip install --disable-pip-version-check -e . pytest ruff build'
          new = 'python -m pip install --disable-pip-version-check -e ".[test]" ruff build'
          if text.count(old) != 1:
              raise SystemExit('unexpected terrain delivery dependency command')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          Path('.github/workflows/patch-terrain-delivery-test-deps.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'ci: install established test extras in terrain delivery'
          git push origin HEAD:codex/terrain-material-repair-final-v2
