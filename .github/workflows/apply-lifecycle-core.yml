name: Apply simulator lifecycle core

on:
  push:
    branches:
      - feat/simulator-lifecycle-core
    paths:
      - ".github/workflows/apply-lifecycle-core.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply lifecycle refactor
        run: python .github/scripts/apply_lifecycle_core.py
      - name: Repair generated guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/shadowbane_lab/sim/timeline.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if self.kind in {ScheduledKind.PHASE_RELEASE, ScheduledKind.PHASE_TRANSITION}
                  and self.phase_index is None:
          '''
          new = '''        if (
              self.kind in {ScheduledKind.PHASE_RELEASE, ScheduledKind.PHASE_TRANSITION}
              and self.phase_index is None
          ):
          '''
          if old not in text:
              raise RuntimeError("generated phase guard was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Remove temporary applicator
        run: rm .github/scripts/apply_lifecycle_core.py .github/workflows/apply-lifecycle-core.yml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Format and validate
        run: |
          ruff format src tests
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Commit lifecycle core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add authoritative simulator lifecycle core"
          git push
