name: Apply simulator lifecycle core

on:
  push:
    branches:
      - feat/simulator-lifecycle-core
    paths:
      - ".github/workflows/apply-lifecycle-core.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply lifecycle refactor
        run: python .github/scripts/apply_lifecycle_core.py
      - name: Repair generated structure
        run: |
          python - <<'PY'
          from pathlib import Path


          def indent_between(path: str, start: str, end: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              segment = text[start_index:end_index]
              if segment.startswith("    "):
                  raise RuntimeError(f"{path}: generated segment was already indented")
              segment = "".join(
                  f"    {line}" if line.strip() else line
                  for line in segment.splitlines(keepends=True)
              )
              target.write_text(
                  text[:start_index] + segment + text[end_index:],
                  encoding="utf-8",
              )


          timeline = Path("src/shadowbane_lab/sim/timeline.py")
          text = timeline.read_text(encoding="utf-8")
          old = '''        if self.kind in {ScheduledKind.PHASE_RELEASE, ScheduledKind.PHASE_TRANSITION}
                  and self.phase_index is None:
          '''
          new = '''        if (
              self.kind in {ScheduledKind.PHASE_RELEASE, ScheduledKind.PHASE_TRANSITION}
              and self.phase_index is None
          ):
          '''
          if old not in text:
              raise RuntimeError("generated phase guard was not found")
          timeline.write_text(text.replace(old, new), encoding="utf-8")

          indent_between(
              "src/shadowbane_lab/sim/environment.py",
              "def _start_action(\n",
              "    def _consume_action_start_triggers(\n",
          )
          indent_between(
              "src/shadowbane_lab/sim/environment.py",
              "def _process_due(\n",
              "    def _delivery_delay(\n",
          )
          indent_between(
              "src/shadowbane_lab/sim/environment.py",
              "def _interrupt_actor(\n",
              "    def _schedule(self, item: ScheduledItem) -> None:\n",
          )
          indent_between(
              "tests/test_reference_environment.py",
              "def test_same_timestamp_actions_use_cancellation_aware_microsteps(self) -> None:\n",
              "    def test_projectile_uses_virtual_travel_time",
          )

          lifecycle_test = Path("tests/test_lifecycle_core.py")
          text = lifecycle_test.read_text(encoding="utf-8")
          old = "    position: Vector2 = Vector2(0.0, 0.0),\n"
          new = "    position: Vector2 | None = None,\n"
          if text.count(old) != 1:
              raise RuntimeError("lifecycle actor helper signature was not found exactly once")
          text = text.replace(old, new, 1)
          old = "        position=position,\n"
          new = "        position=position if position is not None else Vector2(0.0, 0.0),\n"
          if text.count(old) != 1:
              raise RuntimeError("lifecycle actor helper position assignment was not found exactly once")
          lifecycle_test.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove temporary applicator
        run: rm .github/scripts/apply_lifecycle_core.py .github/workflows/apply-lifecycle-core.yml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Format and validate
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Commit lifecycle core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add authoritative simulator lifecycle core"
          git push
