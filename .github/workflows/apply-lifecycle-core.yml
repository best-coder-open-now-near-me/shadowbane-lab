name: Apply simulator lifecycle core

on:
  push:
    branches:
      - feat/simulator-lifecycle-core
    paths:
      - ".github/workflows/apply-lifecycle-core.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply lifecycle refactor
        run: python .github/scripts/apply_lifecycle_core.py
      - name: Remove temporary applicator
        run: rm .github/scripts/apply_lifecycle_core.py .github/workflows/apply-lifecycle-core.yml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Format and validate
        run: |
          ruff format src tests
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Commit lifecycle core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add authoritative simulator lifecycle core"
          git push
