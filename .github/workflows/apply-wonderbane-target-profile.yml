name: Apply WonderBane.com target profile

on:
  push:
    branches:
      - codex/game-behavior-corpus
    paths:
      - ".github/workflows/apply-wonderbane-target-profile.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update target profile and official-source claims
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path.cwd()
          corpus_path = root / "research" / "shadowbane-behavior-corpus-v1.json"
          docs_path = root / "docs" / "game-behavior-corpus.md"
          snapshot_path = root / "research" / "sources" / "wonderbane-com-home-2026-08-29.md"

          corpus = json.loads(corpus_path.read_text(encoding="utf-8"))

          profile = next(
              item for item in corpus["profiles"] if item["profile_id"] == "wonderbane-observed"
          )
          profile["label"] = "WonderBane.com live service"
          profile["description"] = (
              "The official live Shadowbane emulator service at https://wonderbane.com used by "
              "the lab. The target service is identified, but exact client release hashes, "
              "patcher state, server implementation lineage, deployment data and runtime "
              "configuration still require fingerprinting."
          )
          profile["status"] = "active"

          source_id = "wonderbane-official-site-2026-08-29"
          if not any(item["source_id"] == source_id for item in corpus["sources"]):
              corpus["sources"].append(
                  {
                      "source_id": source_id,
                      "label": "WonderBane official website snapshot",
                      "kind": "client_data",
                      "authority": "primary_official",
                      "profiles": ["wonderbane-observed"],
                      "uri": "https://wonderbane.com/",
                      "revision": "mutable homepage snapshotted 2026-08-29",
                      "retrieved_on": "2026-08-29",
                      "scope": [
                          "official service identity",
                          "official client and patcher distribution",
                          "published character-calculator constraints",
                          "published character stat derivation",
                          "official Discord patch-note channel",
                      ],
                      "limitations": [
                          "The homepage does not expose the server source revision, deployment power/effect rows or live configuration.",
                          "Published calculator behavior still needs comparison against exact client and server runtime outputs.",
                      ],
                      "ingestion": {
                          "method": "html_snapshot",
                          "automatable": True,
                          "available": True,
                          "notes": "The repository snapshot records the parsed public statements. Archive downloadable client and patcher hashes separately.",
                      },
                      "capture_status": "captured",
                      "snapshot_path": "research/sources/wonderbane-com-home-2026-08-29.md",
                      "content_sha256": None,
                      "content_type": "text/markdown",
                  }
              )

          claims = [
              {
                  "claim_id": "wonderbane.build.maximum-runes",
                  "profile_id": "wonderbane-observed",
                  "domain": "progression",
                  "subject": "character build",
                  "predicate": "maximum_rune_count",
                  "statement": "The WonderBane character calculator applies a maximum of twelve runes to a character build.",
                  "parameters": {"maximum_runes": 12},
                  "conditions": [
                      "using the official WonderBane.com character calculator",
                      "rune categories are counted under the calculator's published limit",
                  ],
                  "valid_from": None,
                  "valid_to": None,
                  "evidence": [
                      {
                          "source_id": source_id,
                          "locator": "Character Calculator introduction",
                          "stance": "supports",
                          "note": "Officially published calculator constraint; live rejection behavior remains to be traced.",
                      }
                  ],
                  "confidence": "strong",
                  "compile_disposition": "override",
                  "contradiction_group": None,
                  "test_requirements": [
                      "Construct legal builds with eleven, twelve and thirteen total runes in the official calculator.",
                      "Attempt the same boundary in the live WonderBane client and record the rejection point.",
                  ],
                  "tags": ["wonderbane", "build", "runes", "calculator"],
                  "reviewed_on": "2026-08-29",
                  "simulator_bindings": ["builds.runes.maximum_count"],
              },
              {
                  "claim_id": "wonderbane.build.discipline-threshold",
                  "profile_id": "wonderbane-observed",
                  "domain": "progression",
                  "subject": "discipline selection",
                  "predicate": "maximum_count_by_level",
                  "statement": "WonderBane permits at most two disciplines below level 70 and at most three disciplines at level 70 or above.",
                  "parameters": {
                      "below_level_70": 2,
                      "at_or_above_level_70": 3,
                      "threshold_level": 70,
                  },
                  "conditions": [
                      "using the official WonderBane.com character calculator",
                      "discipline eligibility requirements are otherwise satisfied",
                  ],
                  "valid_from": None,
                  "valid_to": None,
                  "evidence": [
                      {
                          "source_id": source_id,
                          "locator": "Character Calculator introduction",
                          "stance": "supports",
                          "note": "The homepage explicitly publishes the level threshold and counts.",
                      }
                  ],
                  "confidence": "strong",
                  "compile_disposition": "override",
                  "contradiction_group": None,
                  "test_requirements": [
                      "Test second and third discipline selection at levels 69 and 70 in the official calculator.",
                      "Verify live trainer or rune-use behavior at the same boundary with an eligible character.",
                  ],
                  "tags": ["wonderbane", "build", "disciplines", "level-gate", "calculator"],
                  "reviewed_on": "2026-08-29",
                  "simulator_bindings": ["builds.disciplines.maximum_count_by_level"],
              },
              {
                  "claim_id": "wonderbane.build.published-stat-derivation",
                  "profile_id": "wonderbane-observed",
                  "domain": "progression",
                  "subject": "base character stat",
                  "predicate": "derivation_formula",
                  "statement": "The official WonderBane calculator derives a displayed stat from race start, class modifier, a five-point race boon, trained modifier and rune stat grants; rune costs reduce the available pool and rune cap grants increase stat caps.",
                  "parameters": {
                      "formula": "race_start + class_modifier + race_boon_5 + trained_modifier + sum(rune_stat_grants)",
                      "race_boon": 5,
                      "pool_deducts_rune_costs": True,
                      "caps_include_rune_cap_grants": True,
                  },
                  "conditions": [
                      "using the official WonderBane.com character calculator",
                      "the selected race, base class, promotion, level and rune gates are legal",
                  ],
                  "valid_from": None,
                  "valid_to": None,
                  "evidence": [
                      {
                          "source_id": source_id,
                          "locator": "Character Calculator derived-stat explanation",
                          "stance": "supports",
                          "note": "The page says the calculator mirrors server stat formulas; exact client/server parity still requires fixtures.",
                      }
                  ],
                  "confidence": "strong",
                  "compile_disposition": "override",
                  "contradiction_group": None,
                  "test_requirements": [
                      "Compare calculator outputs with clean live characters across several race/base/promotion combinations.",
                      "Add one rune stat grant, one rune cost and one rune cap grant at a time and compare exact deltas.",
                      "Record whether race boon application is universal or conditional in the live character sheet.",
                  ],
                  "tags": ["wonderbane", "build", "stats", "runes", "calculator"],
                  "reviewed_on": "2026-08-29",
                  "simulator_bindings": [
                      "builds.stats.base_derivation",
                      "builds.training.available_pool",
                      "builds.stats.cap_derivation",
                  ],
              },
          ]

          existing_claim_ids = {item["claim_id"] for item in corpus["claims"]}
          for claim in claims:
              if claim["claim_id"] not in existing_claim_ids:
                  corpus["claims"].append(claim)
                  existing_claim_ids.add(claim["claim_id"])

          build_claim_ids = [claim["claim_id"] for claim in claims]
          matching_coverage = [
              row for row in corpus["coverage"] if "build" in row["domain"].lower()
          ]
          if len(matching_coverage) != 1:
              raise SystemExit(
                  f"expected exactly one build coverage row, found {len(matching_coverage)}"
              )
          coverage = matching_coverage[0]
          for claim_id in build_claim_ids:
              if claim_id not in coverage["claim_ids"]:
                  coverage["claim_ids"].append(claim_id)
          evidence_step = (
              "Compare the official WonderBane.com calculator against fingerprinted live "
              "character sheets at rune, discipline and stat-derivation boundaries."
          )
          if evidence_step not in coverage["next_evidence"]:
              coverage["next_evidence"].append(evidence_step)

          snapshot_path.parent.mkdir(parents=True, exist_ok=True)
          snapshot_path.write_text(
              """# WonderBane.com official homepage snapshot\n\n"
              "- Retrieved: 2026-08-29\n"
              "- URL: https://wonderbane.com/\n"
              "- Target profile: `wonderbane-observed`\n\n"
              "## Parsed public statements\n\n"
              "The official site identifies the live service as WonderBane and distributes both "
              "`WonderbaneClient.zip` and `WonderBanePatcher.zip`. It links an official Discord "
              "for community discussion, patch notes and support.\n\n"
              "The homepage includes a character calculator described as mirroring server stat "
              "formulas. It publishes a twelve-rune maximum, a two-discipline maximum below level "
              "70, and a three-discipline maximum at level 70 or above.\n\n"
              "Its displayed stat derivation is described as race starting value plus class "
              "modifier, a five-point race boon, trained modifier and all rune stat grants. Rune "
              "costs reduce the available pool, rune cap grants increase stat caps, and rune "
              "availability is filtered by race, base class, promotion, level and current-stat "
              "requirements.\n\n"
              "## Limitations\n\n"
              "This snapshot establishes official service identity and published calculator "
              "behavior. It does not identify the server source commit, deployment power/effect "
              "rows, current patcher manifest, or whether every calculator output exactly matches "
              "the currently running server. Those require package fingerprints and controlled "
              "runtime comparisons.\n"
              """,
              encoding="utf-8",
          )

          corpus_path.write_text(
              json.dumps(corpus, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )

          docs = docs_path.read_text(encoding="utf-8")
          docs = docs.replace(
              "private servers intentionally diverge, and the WonderBane runtime may not match any public\n"
              "description exactly.",
              "private servers intentionally diverge, and the lab's target—the live WonderBane.com\n"
              "service—may not match any public implementation or historical description exactly.",
          )
          docs = docs.replace(
              "| `wonderbane-observed` | The actual client/server environment used for controlled differential observations. It remains pending until binaries, data and server identity are fingerprinted. |",
              "| `wonderbane-observed` | The live WonderBane.com service used for controlled differential observations. The service is identified; exact client, patcher, server lineage, data and configuration still require fingerprinting. |",
          )
          anchor = (
              "Profiles do **not** inherit mechanics automatically. A claim supported for one profile may be\n"
          )
          addition = (
              "The official WonderBane.com homepage is now a first-party source for service identity, "
              "client/patcher distribution and published character-calculator rules. It is not evidence "
              "that WonderBane uses an unmodified public MagicBane commit.\n\n"
          )
          if addition not in docs:
              docs = docs.replace(anchor, addition + anchor)
          docs = docs.replace(
              "### 4. Fingerprint the actual runtime\n\nBefore calling WonderBane “MagicBane behavior,” record:",
              "### 4. Fingerprint the WonderBane.com live runtime\n\nThe target service is now identified. Before assigning MagicBane implementation behavior to it, record:",
          )
          docs_path.write_text(docs, encoding="utf-8")
          PY
      - name: Validate corpus and repository
        run: |
          python -m pip install -e ".[test]"
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Commit target-profile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/shadowbane-behavior-corpus-v1.json \
                  research/sources/wonderbane-com-home-2026-08-29.md \
                  docs/game-behavior-corpus.md
          git commit -m "research: identify WonderBane.com as target runtime"
          git push
