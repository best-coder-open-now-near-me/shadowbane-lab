name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: python -m pip install ruff
      - name: Lint
        run: ruff check src tests scripts/check_transparency_diagnostics.py

  python-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  native-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [full, diagnostics-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure Win32 profile
        run: >-
          cmake -S native/wonderbane_extension
          -B build/native-${{ matrix.profile }}
          -A Win32
          -DWONDERBANE_EXTENSION_PROFILE=${{ matrix.profile }}
      - name: Build Win32 release
        run: cmake --build build/native-${{ matrix.profile }} --config Release
      - name: Run native tests
        run: ctest --test-dir build/native-${{ matrix.profile }} -C Release -LE stretch-diagnostic --output-on-failure
      - name: Install host/native admission test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify admission across host and Win32 consumer processes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:SHADOWBANE_COMBAT_FENCE_V3_TEST_EXE = (Resolve-Path "build/native-${{ matrix.profile }}/Release/wonderbane_extension_combat_v3_fence_test.exe").Path
          $env:SHADOWBANE_COMBAT_CHANNEL_TEST_EXE = (Resolve-Path "build/native-${{ matrix.profile }}/Release/wonderbane_extension_combat_channel_test.exe").Path
          python -m pytest tests/test_combat_fence.py tests/test_combat_wire.py tests/test_combat_wire_v2.py tests/test_combat_ipc_windows.py -q --junitxml=combat-ipc.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; from scripts.build_navigation_inspector_package import validate_combat_ipc_results; validate_combat_ipc_results(Path('combat-ipc.xml'), '${{ matrix.profile }}')"
      - name: Verify actor fences and publication across Win32 processes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:WONDERBANE_ACTOR_ACTION_TEST = (Resolve-Path "build/native-${{ matrix.profile }}/Release/wonderbane_extension_actor_action_wire_test.exe").Path
          $env:SHADOWBANE_ACTOR_PUBLICATION_TEST_EXE = (Resolve-Path "build/native-${{ matrix.profile }}/Release/wonderbane_extension_actor_publication_test.exe").Path
          try {
            python -m pytest tests/test_actor_action_wire.py tests/test_actor_publication.py tests/test_actor_action_session.py tests/test_actor_selector_manifest.py -q --junitxml=actor-ipc.xml
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "from pathlib import Path; from scripts.build_navigation_inspector_package import validate_actor_ipc_results; validate_actor_ipc_results(Path('actor-ipc.xml'), '${{ matrix.profile }}')"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item Env:WONDERBANE_ACTOR_ACTION_TEST -ErrorAction SilentlyContinue
            Remove-Item Env:SHADOWBANE_ACTOR_PUBLICATION_TEST_EXE -ErrorAction SilentlyContinue
          }
      - name: Check deferred transparency diagnostic outcomes
        run: python scripts/check_transparency_diagnostics.py --build-dir build/native-${{ matrix.profile }}
      - name: Retain ideal transparency diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stretch-diagnostics-${{ matrix.profile }}
          path: |
            build/native-${{ matrix.profile }}/stretch-diagnostics.xml
            build/native-${{ matrix.profile }}/stretch-diagnostics.log
          if-no-files-found: error

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem -Path scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            $parseErrors += $errors
          }
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
