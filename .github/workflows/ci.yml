name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: python -m pip install ruff
      - name: Lint
        run: ruff check src tests scripts/check_transparency_diagnostics.py

  python-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  native-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [full, diagnostics-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure Win32 profile
        run: >-
          cmake -S native/wonderbane_extension
          -B build/native-${{ matrix.profile }}
          -A Win32
          -DWONDERBANE_EXTENSION_PROFILE=${{ matrix.profile }}
      - name: Build Win32 release
        run: cmake --build build/native-${{ matrix.profile }} --config Release
      - name: Run native tests
        run: ctest --test-dir build/native-${{ matrix.profile }} -C Release -LE stretch-diagnostic --output-on-failure
      - name: Install host/native admission test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify admission across host and Win32 consumer processes
        shell: pwsh
        run: |
          $env:SHADOWBANE_COMBAT_FENCE_TEST_EXE = (Resolve-Path "build/native-${{ matrix.profile }}/Release/wonderbane_extension_combat_fence_test.exe").Path
          python -m pytest tests/test_combat_fence.py tests/test_combat_wire.py -q
      - name: Check deferred transparency diagnostic outcomes
        run: python scripts/check_transparency_diagnostics.py --build-dir build/native-${{ matrix.profile }}
      - name: Retain ideal transparency diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stretch-diagnostics-${{ matrix.profile }}
          path: |
            build/native-${{ matrix.profile }}/stretch-diagnostics.xml
            build/native-${{ matrix.profile }}/stretch-diagnostics.log
          if-no-files-found: error

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem -Path scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            $parseErrors += $errors
          }
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
