name: Publish corrected terrain repair product tree

on:
  push:
    branches:
      - codex/terrain-material-export-da109b0

permissions:
  contents: write

concurrency:
  group: terrain-publish-corrected-product-4f1a9c
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/client-convergence-v2
          fetch-depth: 0

      - name: Verify allowable parent state
        shell: bash
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          subject=$(git log -1 --pretty=%s)
          if [ "$current" = 'da109b04bc80bdb9ac451846e936c75082635396' ]; then
            exit 0
          fi
          case "$subject" in
            'Repair missing terrain material coverage transactionally'|'Fix terrain repair CI'*)
              git read-tree --reset -u da109b04bc80bdb9ac451846e936c75082635396
              ;;
            *)
              echo "Refusing to replace unexpected authoritative head $current: $subject" >&2
              exit 1
              ;;
          esac

      - name: Fetch exact product patch
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location \
                 -H 'bypass-tunnel-reminder: true' \
                 https://sbterrain-da109b0-4f1a9c.loca.lt/metadata.json \
                 --output /tmp/metadata.json && \
               curl --fail --silent --show-error --location \
                 -H 'bypass-tunnel-reminder: true' \
                 https://sbterrain-da109b0-4f1a9c.loca.lt/terrain-repair.patch \
                 --output /tmp/terrain-repair.patch; then
              ok=true
              break
            fi
            sleep 10
          done
          test "$ok" = true
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          metadata = json.loads(Path('/tmp/metadata.json').read_text(encoding='utf-8'))
          patch = Path('/tmp/terrain-repair.patch').read_bytes()
          assert metadata['base'] == 'da109b04bc80bdb9ac451846e936c75082635396'
          assert metadata['nonempty'] is True
          assert metadata['size'] == len(patch)
          assert metadata['sha256'] == hashlib.sha256(patch).hexdigest()
          PY

      - name: Apply and enforce bounded product paths
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=error-all /tmp/terrain-repair.patch
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only HEAD)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              native/wonderbane_extension/*|docs/investigations/terrain-seam-repair.md|docs/investigations/terrain-resource-ownership.md|docs/diagnostics/terrain-material-poll.md|tests/*|src/shadowbane_lab/*|pyproject.toml)
                ;;
              *) echo "Disallowed product path: $path" >&2; exit 1 ;;
            esac
            case "$path" in
              .github/*|*.exe|*.dll|*.zip|*.7z|*.rar|*.bin|*.dmp|*.jsonl|*evidence*|*capture*)
                echo "Rejected workflow/binary/evidence path: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Commit desired product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git commit -m 'Fix terrain repair CI and ownership safety'
          git push origin HEAD:refs/heads/codex/client-convergence-v2
