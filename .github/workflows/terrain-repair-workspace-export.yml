name: Terrain repair workspace export

on:
  push:
    branches:
      - codex/terrain-material-repair-workspace

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive exact source tree
        run: git archive --format=zip --output=terrain-repair-workspace.zip HEAD
      - name: Fetch public WonderBane patch manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-patch-manifest
          curl --fail --location --retry 4 --retry-delay 2 \
            --user-agent 'WonderBanePatcher/1.0' \
            --output public-patch-manifest/manifest.json \
            'http://87.99.132.84/manifest.json'
          python -m json.tool public-patch-manifest/manifest.json \
            > public-patch-manifest/manifest.pretty.json
          sha256sum public-patch-manifest/manifest.json \
            > public-patch-manifest/manifest.sha256
      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: terrain-repair-workspace
          path: terrain-repair-workspace.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload public patch manifest
        uses: actions/upload-artifact@v4
        with:
          name: wonderbane-public-patch-manifest
          path: public-patch-manifest
          if-no-files-found: error
          retention-days: 1
