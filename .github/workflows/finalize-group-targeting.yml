name: Finalize group targeting foundation

on:
  push:
    branches:
      - feat/group-targeting-foundation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/group-targeting-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Merge repaired simulator base
        run: |
          git fetch origin codex/fix-simulator-foundation-ci
          git merge --no-commit --no-ff origin/codex/fix-simulator-foundation-ci
      - name: Format group-targeting files
        run: >-
          ruff format
          src/shadowbane_lab/sim/affiliations.py
          src/shadowbane_lab/sim/targeting.py
          src/shadowbane_lab/sim/affiliation_codec.py
          src/shadowbane_lab/client_observation/native_identity.py
          src/shadowbane_lab/client_observation/group_affiliations.py
          tests/test_affiliations.py
          tests/test_group_targeting.py
          tests/test_affiliation_codec.py
          tests/test_native_identity.py
          tests/test_group_affiliation_projection.py
      - name: Run focused tests
        run: >-
          python -m unittest
          tests.test_affiliations
          tests.test_group_targeting
          tests.test_affiliation_codec
          tests.test_native_identity
          tests.test_group_affiliation_projection
          -v
      - name: Run full validation
        run: |
          python -m unittest discover -s tests -v
          ruff check .
          ruff format --check .
      - name: Publish validated merge and remove workflow
        run: |
          rm .github/workflows/finalize-group-targeting.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize group targeting on repaired simulator base"
          git push origin HEAD:feat/group-targeting-foundation
