name: Apply canonical damage transaction

on:
  push:
    branches:
      - feat/canonical-damage-transaction
    paths:
      - ".github/workflows/apply-canonical-damage-transaction.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply shared damage reducer
        run: python .github/scripts/apply_canonical_damage_transaction.py
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Format and validate
        run: |
          ruff check --fix src tests
          ruff format src tests
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
      - name: Remove temporary applicator and commit
        run: |
          rm .github/scripts/apply_canonical_damage_transaction.py
          rm .github/workflows/apply-canonical-damage-transaction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: unify damage commitment across attack paths"
          git push
